<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      var theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Tracker — Budget</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
  <nav class="sidebar" id="sidebar" data-active="budget"></nav>
  <div class="page">

    <header class="app-header">
      <p class="app-title">Budget</p>
      <div class="field">
        <label class="field-label" for="budget-month">Monat</label>
        <input type="month" id="budget-month">
      </div>
    </header>

    <div class="kpi-grid">
      <div class="kpi-card">
        <p class="kpi-label">Einnahmen</p>
        <p class="kpi-value credit tabular" id="kpi-income">0.00</p>
      </div>
      <div class="kpi-card">
        <p class="kpi-label">Ausgaben</p>
        <p class="kpi-value debit tabular" id="kpi-expense">0.00</p>
      </div>
      <div class="kpi-card">
        <p class="kpi-label">Cashflow</p>
        <p class="kpi-value tabular" id="kpi-net">0.00</p>
      </div>
      <div class="kpi-card">
        <p class="kpi-label">Verfügbares Restbudget</p>
        <p class="kpi-value tabular" id="kpi-remaining">—</p>
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="section-head">
          <p class="section-title">Ausgaben nach Kategorie</p>
        </div>
        <div id="category-donut" class="donut-wrap"></div>
      </div>

      <div class="panel">
        <div class="section-head">
          <p class="section-title">Top-Ausgabenkategorien</p>
        </div>
        <div id="top-categories"></div>
      </div>
    </div>

    <div class="panel wide-panel">
      <div class="section-head">
        <p class="section-title">Cashflow-Entwicklung</p>
        <span class="section-note">Letzte 12 Monate</span>
      </div>
      <div id="cashflow-chart"></div>
    </div>

    <div class="section-head">
      <p class="section-title">Budgets pro Kategorie</p>
    </div>
    <div id="budget-rows"></div>
    <div class="budget-add-row">
      <select id="new-budget-category"></select>
      <input type="number" id="new-budget-amount" placeholder="Betrag CHF" step="1" min="0">
      <button id="add-budget-btn" class="btn btn-primary" type="button">Budget hinzufügen</button>
    </div>

  </div>
  </div>

  <script src="/sidebar.js"></script>
  <script src="/budget.js"></script>
</body>
</html>
